  <!-- ================= 核心脚本数据 ================= -->
  <script>
    // 轮播 Banner 数据
    const BANNERS = [
      { main: "人生 · 贵在坚持", sub: "换个角度，你会发现不一样的风景" },
      { main: "折腾 · 享受探索", sub: "把复杂的技术与网络，装进随手可及的抽屉" },
      { main: "记录 · 沉淀思考", sub: "保持专注，保持对数字生活的热爱" }
    ];
    let bannerIdx = 0;

    function nextBanner() {
      bannerIdx = (bannerIdx + 1) % BANNERS.length;
      updateBannerUI();
    }
    function prevBanner() {
      bannerIdx = (bannerIdx - 1 + BANNERS.length) % BANNERS.length;
      updateBannerUI();
    }
    function updateBannerUI() {
      const mainEl = document.getElementById('bannerMainText');
      const subEl = document.getElementById('bannerSubText');
      mainEl.style.opacity = 0;
      subEl.style.opacity = 0;
      setTimeout(() => {
        mainEl.textContent = BANNERS[bannerIdx].main;
        subEl.textContent = BANNERS[bannerIdx].sub;
        mainEl.style.opacity = 1;
        subEl.style.opacity = 1;
      }, 150);
    }
    setInterval(nextBanner, 7000);

    // 文章数据源
    const POSTS = [
      {
        id: 1,
        category: "网络加速",
        title: "Docker 搭建轻量级私有网络加速节点与测速工具",
        summary: "从零开始在家庭小主机或 VPS 上快速容器化部署轻量网络工具面板，详细配置与持久化实践...",
        date: "2026-10-27",
        readTime: "8 分钟",
        views: "1.2k",
        cover: "./images/covers/post-1.jpg",

用户对网页速度的感知极其敏锐。打开一个链接如果超过两秒没有实质反馈，大部分人会选择关闭页面。抛开一切代码实现与图表结构，提速的核心逻辑可以归纳为四句话：

走更短的物理线路。

搬更小的数据行李。

别做重复的计算与请求。

优先保障眼睛看到的与手指点到的。

一、 缩短物理通路：就近派送与专用快道
互联网并不是瞬时传输的真空，光纤中的信号衰减与公网节点的层层转发现象真实存在。如果服务器放在北美，亚洲用户访问时就必须承受数千公里的物理往返时延。

边缘派送机制：把网站里通用的静态内容分发并复制到遍布全球的节点服务器上。用户发起访问时，系统自动识别并连接离其物理距离最近的节点直接吐出内容，免去了长途跨国跨网回源的等待。

现代通信通道演进：老式协议在网络发生偶发丢包时，容易导致整条连接的所有后续数据一起堵塞等待。新一代通信协议基于更灵活的机制，允许多个资源并发传输，即便某一个片段临时卡壳，其余内容也能照常送达。

前端边缘快速决断：把部分基础的判断逻辑（例如辨别用户所在国家、设备类型或基本身份状态）直接放在网络边缘节点执行，无需每次都把请求打回中心数据库，显著减少了往返周期。

二、 极限瘦身：只送必需品，绝不超载
网络通道再通畅，传送一件笨重的包裹也远比传送一页轻薄的信纸费时。

多媒体的体积压缩：很多网站加载缓慢的元凶在于未经优化的原始高清图片。借助更高效的现代压缩算法，能够在肉眼几乎察觉不到画质损失的前提下，将文件体积削减三到五成。

按需派送与视口加载：页面往往有很长的下半部分，但用户刚点开时视线只落在第一屏。优先只派送第一屏所需的字和图，至于后面的长文、评论区与尾部介绍，等用户真正往下滑动时再在后台悄悄拉取，既省流量又极大缩短了首屏等待时间。

逻辑拆包与分流：很多页面在初次载入时，把网站所有功能模块的代码揉成一团全塞给访客。合理的策略是按功能拆解，访问主页就只拿主页相关的内容，用户点击去结账或去后台时，再去拿对应的增量部分。

三、 本地记忆：利用缓存消除无意义的重复消耗
在性能工程中，效率最高的操作永远是“直接不请求”。

终端的长期记忆：对于那些发布后基本不会改动的文件，可以在首次交付时告知用户的浏览器：“此文件长效有效，存入本地磁盘即可，后续打开本站直接调用，无需再向服务器确认”。

服务器端微量暂存：面对瞬时涌入的海量访问，很多页面读取的数据在短时间内其实完全一致。服务器若将这些结果在内存中暂存几秒钟，就能直接消化掉数以千计的同类请求，避免数据库被瞬间冲垮。

后台静默换新：把高频查看的页面提前烘焙成易于分发的现成页面。后台一旦产生内容变动，系统在后台悄悄生成新版本，用户前台访问依然秒开，完全感知不到数据生成的计算开销。

四、 善待终端设备：让眼睛与手指感到流畅
数据安全下载到手机或电脑后，设备的处理器还需要将这堆数据解析并绘制在屏幕上。如果设备的主线程算力被挤爆，用户就会遭遇白屏、无响应或卡顿。

首屏关键元素插队：排定严格的呈现优先级。用户第一眼要看的标题、核心大图拥有最高通行权，必须抢先呈现；而像埋点统计、外部客服组件等不影响主体阅读的脚本，一律挪到后台排队延后加载。

杜绝页面突兀跳动：很多糟糕的体验来自于页面刚打开时文字正在显示，上方突然插进一张后加载出来的图片，导致整体版面往下猛然一沉，直接打断了阅读和点击。在页面构筑之初就给所有待加载的多媒体预留好固定的占位空间，即可确保版面平稳不移位。

切碎耗时重任务：当设备需要执行一段耗费计算资源的操作时，把任务切碎成多个极小片段，在设备运行的空隙中分批执行，随时保留足够的反应能力去响应用户的触控、滚动与缩放。

网站提速不是单一环节的突击，而是一整套严丝合缝的减负与协同思路：物理层面搬近、体积层面做减法、请求层面借力记忆、呈现层面保障视觉焦点。把这些逻辑贯穿起来，页面就能在各种复杂网络与设备环境中始终保持轻盈。</p>
        `
      },
    ];

    let currentFilter = '全部';
    let currentSearch = '';

    // 渲染文章列表
    function renderPosts() {
      const container = document.getElementById('postsContainer');
      const countBadge = document.getElementById('articleCountBadge');
      
      const filtered = POSTS.filter(post => {
        const matchesCategory = currentFilter === '全部' || post.category === currentFilter;
        const matchesSearch = !currentSearch || 
          post.title.toLowerCase().includes(currentSearch.toLowerCase()) ||
          post.summary.toLowerCase().includes(currentSearch.toLowerCase()) ||
          post.tags.some(t => t.toLowerCase().includes(currentSearch.toLowerCase()));
        return matchesCategory && matchesSearch;
      });

      countBadge.textContent = `共 ${filtered.length} 篇`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-16 text-center text-stone-400">
            <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
            <p class="text-sm">没有找到相关文章，换个搜索词试试？</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = filtered.map(post => `
        <article onclick="navigateToPost(${post.id})" class="group cursor-pointer rounded-2xl bg-white/70 dark:bg-stone-900/70 border border-stone-200/80 dark:border-stone-800/80 hover:border-stone-400 dark:hover:border-stone-600 p-4 flex flex-col justify-between transition-all duration-200 hover:-translate-y-1 shadow-sm">
          
          <div class="relative w-full h-44 rounded-xl overflow-hidden bg-stone-200/60 dark:bg-stone-800 mb-3.5">
            <img 
              src="${post.cover}" 
              alt="${post.title}" 
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
              onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&auto=format&fit=crop&q=80';"
            />
            <span class="absolute top-2.5 left-2.5 text-[11px] font-medium px-2.5 py-0.5 rounded-md bg-stone-900/80 text-white backdrop-blur shadow-sm">
              ${post.category}
            </span>
          </div>

          <div>
            <h3 class="text-base font-bold text-stone-900 dark:text-stone-100 group-hover:text-stone-600 dark:group-hover:text-stone-300 transition-colors line-clamp-1 mb-1.5">
              ${post.title}
            </h3>
            <p class="text-xs text-stone-500 dark:text-stone-400 line-clamp-2 leading-relaxed mb-4 font-light">
              ${post.summary}
            </p>
          </div>

          <div class="pt-3 border-t border-stone-100 dark:border-stone-800/80 flex items-center justify-between text-[11px] text-stone-400">
            <div class="flex items-center gap-2">
              <span>${post.date}</span>
              <span>•</span>
              <span>${post.readTime}</span>
            </div>
            <div class="flex items-center gap-1 text-stone-700 dark:text-stone-300 font-medium group-hover:translate-x-1 transition-transform">
              <span>阅读全文</span>
              <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
            </div>
          </div>

        </article>
      `).join('');

      lucide.createIcons();
    }

    // 单页切换：进入文章详情页面
    function navigateToPost(id) {
      const post = POSTS.find(p => p.id === id);
      if (!post) return;

      document.getElementById('detailCategory').textContent = post.category;
      document.getElementById('detailTitle').textContent = post.title;
      document.getElementById('detailDate').innerHTML = `<i data-lucide="calendar" class="w-4 h-4"></i> 发布于 ${post.date}`;
      document.getElementById('detailReadTime').innerHTML = `<i data-lucide="clock" class="w-4 h-4"></i> 预估阅读 ${post.readTime}`;
      document.getElementById('detailViews').innerHTML = `<i data-lucide="eye" class="w-4 h-4"></i> ${post.views} 次阅读`;
      document.getElementById('detailContent').innerHTML = post.content;

      document.getElementById('homeView').classList.add('hidden');
      document.getElementById('articleDetailView').classList.remove('hidden');

      window.location.hash = `post-${id}`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      lucide.createIcons();
    }

    // 单页切换：返回首页
    function showHomePage(cat) {
      document.getElementById('articleDetailView').classList.add('hidden');
      document.getElementById('homeView').classList.remove('hidden');
      window.location.hash = 'home';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (cat) {
        filterCategory(cat);
      }
    }

    // 分类筛选事件（更新为温和的灰调高亮）
    function filterCategory(cat) {
      currentFilter = cat;
      document.getElementById('currentCategoryTitle').textContent = cat === '全部' ? '全部文章' : `${cat} 专栏`;
      
      document.querySelectorAll('.cat-pill').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = "cat-pill whitespace-nowrap px-4 py-2 rounded-full text-sm font-semibold transition-all bg-stone-200/90 text-stone-900 border border-stone-300/80 dark:bg-stone-800 dark:text-stone-100 dark:border-stone-700 shadow-sm";
        } else {
          btn.className = "cat-pill whitespace-nowrap px-4 py-2 rounded-full text-sm text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-100 hover:bg-stone-200/50 dark:hover:bg-stone-800/50 transition-all";
        }
      });

      renderPosts();
    }

    // 实时搜索
    function handleSearch(val) {
      currentSearch = val.trim();
      renderPosts();
    }

    // 标签点击过滤
    function searchTag(tag) {
      showHomePage('全部');
      const input = document.getElementById('searchInput');
      input.value = tag;
      handleSearch(tag);
    }

    // 移动端折叠菜单
    function toggleMobileNav() {
      const menu = document.getElementById('mobileNavMenu');
      menu.classList.toggle('hidden');
    }

    // 主题切换
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // 监听 Hash 路由
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash;
      if (hash.startsWith('#post-')) {
        const id = parseInt(hash.replace('#post-', ''));
        navigateToPost(id);
      } else {
        showHomePage();
      }
    });

    // 初始化
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      renderPosts();
      lucide.createIcons();

      const hash = window.location.hash;
      if (hash.startsWith('#post-')) {
        const id = parseInt(hash.replace('#post-', ''));
        navigateToPost(id);
      }
    });
  </script>
</body>
</html>
